; Upload limits for admin media (background video/image).
; The app caps video at 30MB; these must sit above that or PHP rejects the file
; before any app code runs. post_max_size covers the WHOLE request body — file
; plus every other form field — so it is deliberately larger than the file cap.
; Read by PHP running as CGI/FastCGI/PHP-FPM (the usual shared-hosting setup).
upload_max_filesize = 32M
post_max_size = 40M
memory_limit = 128M
max_file_uploads = 20

; A 30MB upload on a slow connection needs time to arrive; the defaults can cut
; it off mid-transfer and surface as a mysterious "upload didn't finish".
max_execution_time = 300
max_input_time = 300
